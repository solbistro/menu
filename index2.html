<style>
:root{
  --gold:#e9c440; --gold-2:#f3d763; --gold-dim:rgba(233,196,64,.35);
  --bg:#141518; --bg-2:#1b1d21; --card:#202227; --line:rgba(255,255,255,.08);
  --text:#f4efe4; --muted:#a39d90; --veg:#8fd19e; --spicy:#ff8a6b; --danger:#ff6b6b;
  --radius:16px; --bar-h:0px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--text);min-height:100vh;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  line-height:1.45;padding-bottom:calc(24px + var(--safe-b))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* ---------- Header ---------- */
.hero{background:radial-gradient(120% 120% at 50% 0%,#2a2620 0%,var(--bg) 70%);padding:18px 0 14px}
.hero .wrap:first-child{display:flex;align-items:center;gap:14px}
.logo{flex:0 0 auto;width:58px;height:58px;border-radius:50%;border:2.5px solid var(--gold);display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1}
.logo b{font-weight:800;font-size:19px;letter-spacing:.02em}.logo i{font-style:normal;font-size:11px;opacity:.8;margin-top:2px}
.brand{flex:1;min-width:0}
.brand h1{font-size:22px;font-weight:800;letter-spacing:.02em}
.wifi{margin-top:12px;display:inline-flex;white-space:nowrap;align-items:center;gap:6px;font-size:13px;color:var(--muted);
  background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.wifi strong{color:var(--text);font-weight:600;letter-spacing:.02em}
.wifi .cp{color:var(--gold);font-size:12px}
.lang-btn{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--gold-dim);background:rgba(233,196,64,.08);
  border-radius:999px;padding:9px 14px;font-size:15px;font-weight:600;min-height:44px}
.lang-btn svg{width:18px;height:18px}

/* ---------- Sticky bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:rgba(20,21,24,.92);backdrop-filter:saturate(1.4) blur(10px);
  -webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:4px;margin:10px 0 8px}
.seg button{border-radius:10px;padding:10px 8px;font-weight:700;font-size:16px;color:var(--muted);min-height:44px}
.seg button[aria-selected="true"]{background:linear-gradient(90deg,var(--gold),var(--gold-2));color:#1a1a1a}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;scroll-padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--bg-2);border-radius:999px;padding:7px 14px;font-size:14px;
  white-space:nowrap;color:#d8d2c5;min-height:36px;text-decoration:none;display:inline-flex;align-items:center}
.chip[aria-current="true"]{border-color:var(--gold);color:var(--gold);background:rgba(233,196,64,.1)}
.tools{display:flex;gap:8px;align-items:center;padding-top:14px;flex-wrap:wrap}
.toggle{flex:0 0 auto;border:1px solid var(--line);background:var(--bg-2);border-radius:12px;padding:9px 12px;font-size:14px;min-height:44px;color:#d8d2c5}
.toggle[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(233,196,64,.1)}
.toggle.veg[aria-pressed="true"]{border-color:var(--veg);color:var(--veg);background:rgba(143,209,158,.1)}
.toggle.spicy[aria-pressed="true"]{border-color:var(--spicy);color:var(--spicy);background:rgba(255,138,107,.1)}

/* ---------- Notices ---------- */
.notices{margin:16px 0 4px;display:grid;gap:10px}
.notice{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.notice summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 16px;font-weight:700;color:var(--gold);cursor:pointer;font-size:15px}
.notice summary::-webkit-details-marker{display:none}
.notice summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:.2s}
.notice[open] summary::after{transform:rotate(-135deg)}
.notice ul{list-style:none;padding:0 16px 14px;display:grid;gap:6px;font-size:15px;color:#ddd6c8}
.notice li{display:flex;gap:8px}.notice li::before{content:"•";color:var(--gold)}
.banner{margin-top:12px;font-size:13px;color:#ffd58a;background:rgba(255,183,3,.08);border:1px solid rgba(255,183,3,.3);border-radius:12px;padding:8px 12px;display:none}
.banner.show{display:block}

/* ---------- Menu ---------- */
main{padding-top:6px}
.cols{columns:1;column-gap:28px}
@media (min-width:860px){.cols{columns:2}}
.sec{break-inside:avoid;padding-top:18px;margin-bottom:8px;scroll-margin-top:calc(var(--bar-h) + 8px)}
.sec h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.sec h2 .t{display:inline-block;background:linear-gradient(90deg,var(--gold),var(--gold-2));color:#1a1a1a;font-size:18px;font-weight:800;
  letter-spacing:.06em;padding:5px 30px 5px 12px;clip-path:polygon(0 0,90% 0,100% 50%,90% 100%,0 100%)}
.sec h2 .s{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left;border-radius:10px}
button.item:hover{background:rgba(255,255,255,.03)}
.item .th{flex:0 0 64px;width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--bg-2)}
.item .nm{flex:1;min-width:0}
.item .p1{font-size:17px;font-weight:700;line-height:1.3}
.item .p1 .ing{word-break:keep-all;overflow-wrap:anywhere;font-size:13.5px;font-weight:500;color:var(--muted);margin-left:8px}
.item.out .p1 .ing{text-decoration:none}
.item .p2{font-size:13.5px;color:var(--muted);margin-top:2px}
.item .info{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--gold-dim);
  color:var(--gold);font-size:11px;font-weight:800;margin-left:6px;vertical-align:2px;font-style:normal}
.item .pr{flex:0 0 auto;font-weight:800;color:var(--gold);font-size:17px;white-space:nowrap;padding-top:1px}
.item .pr small{font-size:11px;font-weight:700;opacity:.85;margin-right:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.bd{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:#cfc8ba;line-height:1.5}
.bd.veg{color:var(--veg);border-color:rgba(143,209,158,.55)}
.bd.spicy{color:var(--spicy);border-color:rgba(255,138,107,.55)}
.bd.al{color:#f3a6c0;border-color:rgba(243,166,192,.45)}
.bd.body{color:#9cc3ff;border-color:rgba(156,195,255,.45);letter-spacing:.08em}
.bd.so{color:#fff;background:var(--danger);border-color:var(--danger)}
.item.out .p1,.item.out .p2,.item.out .pr{opacity:.45}.item.out .p1{text-decoration:line-through}
.legend{font-size:12.5px;color:var(--muted);margin:14px 0 0;display:flex;gap:14px;flex-wrap:wrap}
.state{text-align:center;padding:56px 16px;color:var(--muted)}
.state h3{color:var(--text);font-size:18px;margin-bottom:8px}
.state .btn{margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:10px 18px;font-weight:700;min-height:44px}
.sk{height:62px;border-radius:12px;background:linear-gradient(90deg,#1d1f23 0%,#25282d 50%,#1d1f23 100%);background-size:200% 100%;animation:sh 1.2s infinite;margin:12px 0}
@keyframes sh{to{background-position:-200% 0}}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:#7d786d;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
footer button{color:var(--gold);font-size:13px;padding:8px 0}
.spin{display:inline-block;animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- Sheets (dialog) ---------- */
dialog{border:0;padding:0;background:var(--card);color:var(--text);width:min(520px,100%);max-height:85vh;border-radius:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
@media (max-width:640px){dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:22px 22px 0 0;padding-bottom:var(--safe-b)}
  dialog[open]{animation:up .22s ease-out}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.dh{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.dh h3{flex:1;font-size:19px}
.dx{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.07);font-size:20px;line-height:1}
.db{padding:0 18px 20px;overflow:auto;max-height:calc(85vh - 70px)}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.langs button{border:1px solid var(--line);background:var(--bg-2);border-radius:12px;padding:13px 12px;text-align:left;font-size:16px;min-height:48px}
.langs button[aria-current="true"]{border-color:var(--gold);color:var(--gold);background:rgba(233,196,64,.1);font-weight:700}
.det img{width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin-bottom:12px}
.det .p2{color:var(--muted);margin-top:-6px;margin-bottom:10px}
.det .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.det .pr{font-size:22px;font-weight:800;color:var(--gold)}
.det h4{font-size:13px;color:var(--gold);letter-spacing:.06em;margin:14px 0 4px}
.det p{color:#ddd6c8;font-size:15px;white-space:pre-line}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translate(-50%,20px);background:#2b2d33;border:1px solid var(--gold-dim);
  color:var(--text);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="logo" aria-hidden="true"><b>SOL</b><i>bistro</i></div>

    <button class="lang-btn" id="langBtn" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
      <span id="langLabel"></span>
    </button>
  </div>
  <div class="wrap">
    <button class="wifi" id="wifiBtn" type="button">

  </div>
</div>

<div class="wrap">

    </div>
  <div class="banner" id="banner" role="status"></div>
  <section class="notices" id="notices" aria-label="Info"></section>
  <main id="menu" aria-live="polite"></main>
  <footer>
    <span id="updated"></span>
    <button id="refreshBtn" type="button"><span id="refreshIcon" aria-hidden="true">↻</span> <span data-i="refresh"></span></button>

</div>

<dialog id="langDlg" aria-labelledby="langTitle">

  <div class="db"><div class="langs" id="langList"></div></div>
</dialog>
<dialog id="detDlg" aria-labelledby="detTitle">
  <div class="dh"><h3 id="detTitle"></h3><button class="dx" data-close aria-label="Close">×</button></div>
  <div class="db det" id="detBody"></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

// 分類名稱翻譯（試算表裡的分類英文名，不分大小寫）
const CAT_I18N = {

// ===================== 狀態 =====================
const S = {
  lang: 'zh', type: 'food', veg: false, spicy: false,
  food: [], drink: [], meta: { rules: [], notes: [] },   // food/drink: [{key, items:[...]}]
  updatedAt: 0, loading: false, loaded: false, error: false
};
let FIRST_VISIT = true; try { FIRST_VISIT = !localStorage.getItem('sol-seen'); } catch (e) {}
const ITEMS = new Map(); // id -> item（給詳細資訊視窗用）

const $ = s => document.querySelector(s);
const t = key => { const a = UI[key]; return a ? (a[CODES.indexOf(S.lang)] || a[2]) : key; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const truthy = v => v === true || /^(true|yes|y|1|v)$/i.test(String(v ?? '').trim());
const num = v => { const n = Number(String(v ?? '').replace(/[^\d.]/g, '')); return isFinite(n) ? n : 0; };
const safeUrl = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';

// ===================== 多語內容 =====================
function fieldFor(item, code) {
  if (code === 'zh') return item.zh || item['zh-TW'] || '';
  if (code === 'zh-CN') return item['zh-CN'] || item.zhCN || '';
  return item[code] || '';
}
// 主要名稱：目前語言 → 中文互補 → 英文 → 任何有值的語言
function primaryName(item, lang) {
  const order = [lang];
  if (lang === 'zh') order.push('zh-CN'); if (lang === 'zh-CN') order.push('zh');
  order.push('en', 'zh', 'zh-CN', 'ja', 'ko', 'fr', 'th', 'fil', 'vi');
  for (const c of order) { const v = String(fieldFor(item, c)).trim(); if (v) return { text: v, code: c }; }
  return { text: '—', code: lang };
}
// 第二行：中文介面顯示英文，其他語言顯示中文（方便跟店員溝通）
function secondaryName(item, lang, primaryText) {
  const order = (lang === 'zh' || lang === 'zh-CN') ? ['en'] : ['zh', 'en'];
  for (const c of order) {
    const v = String(fieldFor(item, c)).trim();
    if (v && v !== primaryText) return { text: v, code: c };
  }
  return null;
}
function pickLangText(field, lang) {
  if (!field) return '';
  if (typeof field === 'object' && !Array.isArray(field)) {
    const p = primaryName(field, lang).text; return p === '—' ? '' : p;
  }
  return String(field).trim();
}
function catLabel(key) {
  const a = CAT_I18N[key.toUpperCase()];
  if (!a) return { main: key, sub: '' };
  const i = CODES.indexOf(S.lang);
  const main = a[i] || a[2];
  const sub = (S.lang === 'en') ? '' : (main.toUpperCase() === key.toUpperCase() ? '' : key.toUpperCase());
  return { main, sub };
}

// ===================== 資料整理 =====================
function normCat(c) { return String(c ?? '').trim().replace(/\s+/g, ' ').toUpperCase(); }

function group(list, type) {
  const map = new Map();
  (list || []).forEach((raw, idx) => {
    if (!raw || typeof raw !== 'object') return;
    let cats = type === 'drink' ? raw.categories : (raw.category ?? raw.Category ?? raw.categoryName ?? raw.categories);
    if (typeof cats === 'string') cats = cats.split(/[,，、]/);
    if (!Array.isArray(cats) || !cats.length) cats = [type === 'food' ? 'FOOD' : 'OTHER'];
    const item = { ...raw, _id: `${type}-${idx}` };
    ITEMS.set(item._id, item);
    [...new Set(cats.map(normCat).filter(Boolean))].forEach(k => {
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(item);
    });
  });
  let keys = [...map.keys()];
  if (type === 'food') {
    keys.sort((a, b) => {
      const ia = FOOD_ORDER.indexOf(a), ib = FOOD_ORDER.indexOf(b);
      return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
    });
  }
  return keys.map(key => ({ key, items: map.get(key) }));
}

function applyData(raw) {
  ITEMS.clear();
  S.food = group(raw.food, 'food');
  S.drink = group(raw.drink, 'drink');
  const m = raw._meta || {};
  S.meta = { rules: Array.isArray(m.rules) ? m.rules : [], notes: Array.isArray(m.notes) ? m.notes : [] };
  S.loaded = true;
}

// ===================== 載入 =====================
async function fetchMenu() {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(API_URL, { cache: 'no-store', signal: ctrl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.json();
    if (!raw || raw.error) throw new Error(raw?.message || 'API error');
    if (!Array.isArray(raw.food) && !Array.isArray(raw.drink)) throw new Error('Unexpected data format');
    return raw;
  } finally { clearTimeout(timer); }
}

async function load({ silent = false } = {}) {
  if (S.loading) return;
  S.loading = true; setRefreshing(true);
  if (!S.loaded && !silent) renderMenu();
  try {
    const raw = await fetchMenu();
    applyData(raw);
    S.updatedAt = Date.now(); S.error = false;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: S.updatedAt, raw })); } catch (e) {}
    $('#banner').classList.remove('show');
  } catch (err) {
    console.error('Menu load failed:', err);
    S.error = true;
    if (S.loaded) { $('#banner').textContent = '⚠️ ' + t('cached'); $('#banner').classList.add('show'); }
  } finally {
    S.loading = false; setRefreshing(false); renderAll();
  }
}

function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (c && c.raw) { applyData(c.raw); S.updatedAt = c.t || 0; return true; }
  } catch (e) {}
  return false;
}

// ===================== 繪製 =====================
function renderStatic() {
  document.documentElement.lang = htmlLang(S.lang);
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  $('#wifiPw').textContent = WIFI_PASSWORD;
  $('#langLabel').textContent = (LANGS.find(l => l.code === S.lang) || LANGS[0]).label;
  $('#fSpicy').hidden = S.type !== 'food';
  $('#fVeg').hidden = S.type !== 'food';
  document.querySelector('.tools').hidden = S.type !== 'food';
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.type === S.type)));
  $('#langList').innerHTML = LANGS.map(l =>
    `<button type="button" data-lang="${l.code}" lang="${l.html}" aria-current="${l.code === S.lang}">${esc(l.label)}</button>`).join('');
  if (S.error && S.loaded) $('#banner').textContent = '⚠️ ' + t('cached');
}

function renderNotices() {
  const box = $('#notices');
  const li = arr => arr.map(it => {
    const txt = typeof it === 'object' ? pickLangText(it, S.lang) : String(it);
    return txt ? `<li>${esc(txt)}</li>` : '';
  }).join('');
  const parts = [];
  const rules = li(S.meta.rules), notes = li(S.meta.notes);
  if (rules) parts.push(`<details class="notice" ${FIRST_VISIT ? 'open' : ''}><summary>📋 ${esc(t('rules'))}</summary><ul>${rules}</ul></details>`);
  if (notes) parts.push(`<details class="notice"><summary>💬 ${esc(t('notes'))}</summary><ul>${notes}</ul></details>`);
  box.innerHTML = parts.join('');
  try { localStorage.setItem('sol-seen', '1'); } catch (e) {}
}

function matches(item) {
  if (S.type === 'food' && S.veg && !truthy(item.vegan)) return false;
  if (S.type === 'food' && S.spicy && num(item.spicy) <= 0) return false;
  return true;
}

// 成分：試算表可用逗號、頓號、分號或斜線分隔，統一用「 / 」顯示
function ingredientsText(item) {
  return pickLangText(item.ingredients, S.lang)
    .split(/\s*[,，、;；\/／|\n]\s*/).map(x => x.trim()).filter(Boolean).join(' / ');
}

function hasDetails(item) {
  return !!(pickLangText(item.contains, S.lang) || pickLangText(item.notes, S.lang) || safeUrl(item['img-url'] || item.img));
}

function badges(item) {
  const b = [];
  if (truthy(item.soldout)) b.push(`<span class="bd so">${esc(t('soldout'))}</span>`);
  if (S.type === 'food') {
    if (truthy(item.vegan)) b.push(`<span class="bd veg">🌱 ${esc(t('veg'))}</span>`);
    const sp = Math.min(num(item.spicy), 3);
    if (sp > 0) b.push(`<span class="bd spicy" title="${esc(t('spicy'))}">${'🌶'.repeat(sp)}</span>`);
  } else {
    const al = num(item.alcohol);
    if (al > 0) b.push(`<span class="bd al" title="${esc(t('alcohol'))}">🍷 ${'●'.repeat(Math.min(Math.ceil(al / 3), 3))}${'○'.repeat(3 - Math.min(Math.ceil(al / 3), 3))}</span>`);
    const bo = Math.min(num(item.body), 3);
    if (bo > 0) b.push(`<span class="bd body" title="${esc(t('body'))}">◆${'●'.repeat(bo)}${'○'.repeat(3 - bo)}</span>`);
    const fl = pickLangText(item.flavor, S.lang);
    if (fl) fl.split(/[,，;；、]/).map(s => s.trim()).filter(Boolean).slice(0, 3).forEach(f => b.push(`<span class="bd">${esc(f)}</span>`));
  }
  return b.length ? `<div class="badges">${b.join('')}</div>` : '';
}

function itemHtml(item) {
  const p = primaryName(item, S.lang);
  const s = secondaryName(item, S.lang, p.text);
  const img = safeUrl(item['img-url'] || item.img);
  const det = hasDetails(item);
  const ing = ingredientsText(item);
  const out = truthy(item.soldout);
  const price = num(item.price);
  const tag = det ? 'button' : 'div';
  return `<${tag} class="item${out ? ' out' : ''}" ${det ? `type="button" data-id="${item._id}" aria-haspopup="dialog"` : ''}>
    ${img ? `<img class="th" src="${esc(img)}" alt="" loading="lazy" decoding="async" width="64" height="64" onerror="this.remove()">` : ''}
    <div class="nm">
      <div class="p1"><span lang="${htmlLang(p.code)}">${esc(p.text)}</span>${ing ? `<span class="ing">${esc(ing)}</span>` : ''}${det ? '<i class="info" aria-hidden="true">i</i>' : ''}</div>
      ${s ? `<div class="p2" lang="${htmlLang(s.code)}">${esc(s.text)}</div>` : ''}
      ${badges(item)}
    </div>
    <div class="pr">${price ? `<small>NT$</small>${price.toLocaleString('en-US')}` : esc(item.price ?? '')}</div>
  </${tag}>`;
}

const secId = k => `c-${S.type}-${k.replace(/[^A-Za-z0-9]+/g, '-')}`;
function renderMenu() {
  const menu = $('#menu'), chips = $('#chips');
  if (!S.loaded) {
    chips.innerHTML = '';
    if (S.error) {
      menu.innerHTML = `<div class="state"><h3>😥</h3><p>${esc(t('error'))}</p><button class="btn" type="button" id="retryBtn">↻ ${esc(t('retry'))}</button></div>`;
    } else {
      menu.innerHTML = `<p class="sr">${esc(t('loading'))}</p>` + '<div class="sk"></div>'.repeat(8);
    }
    return;
  }
  const groups = S[S.type].map(g => ({ key: g.key, items: g.items.filter(matches) })).filter(g => g.items.length);
  if (!groups.length) {
    chips.innerHTML = '';
    menu.innerHTML = `<div class="state"><h3>🔍 ${esc(t('empty'))}</h3><button class="btn" type="button" id="clearBtn">${esc(t('clear'))}</button></div>`;
    return;
  }
  chips.innerHTML = groups.map((g, i) => {
    const l = catLabel(g.key);
    return `<a class="chip" href="#${secId(g.key)}" data-k="${esc(g.key)}" aria-current="${i === 0}">${esc(l.main)}</a>`;
  }).join('');
  const legend = S.type === 'drink' && groups.some(g => g.items.some(it => num(it.alcohol) > 0 || num(it.body) > 0))
    ? `<p class="legend"><span>🍷 ●●○ = ${esc(t('alcohol'))}</span><span>◆●●○ = ${esc(t('body'))}</span></p>` : '';
  menu.innerHTML = legend + `<div class="cols">${groups.map(g => {
    const l = catLabel(g.key);
    return `<section class="sec" id="${secId(g.key)}" data-k="${esc(g.key)}">
      <h2><span class="t">${esc(l.main)}</span>${l.sub ? `<span class="s">${esc(l.sub)}</span>` : ''}</h2>
      ${g.items.map(itemHtml).join('')}
    </section>`;
  }).join('')}</div>`;
  observeSections();
}

function renderUpdated() {
  if (!S.updatedAt) { $('#updated').textContent = ''; return; }
  const d = new Date(S.updatedAt);
  $('#updated').textContent = `${t('updated')} ${d.toLocaleString(htmlLang(S.lang), { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}`;
}

function renderAll() { renderStatic(); renderNotices(); renderMenu(); renderUpdated(); measureBar(); }

function setRefreshing(on) {
  $('#refreshBtn').disabled = on;
  $('#refreshIcon').classList.toggle('spin', on);
}

// ===================== 分類導覽（捲動時自動標示） =====================
let io;
function observeSections() {
  if (io) io.disconnect();
  if (!('IntersectionObserver' in window)) return;
  const visible = new Map();
  io = new IntersectionObserver(entries => {
    entries.forEach(e => visible.set(e.target.dataset.k, e.isIntersecting ? e.boundingClientRect.top : null));
    let best = null, bestTop = Infinity;
    visible.forEach((top, k) => { if (top !== null && top < bestTop) { best = k; bestTop = top; } });
    if (best) setChip(best);
  }, { rootMargin: `-${(S.barH || 0) + 10}px 0px -55% 0px` });
  document.querySelectorAll('.sec').forEach(s => io.observe(s));
}
function setChip(k) {
  document.querySelectorAll('.chip').forEach(c => {
    const on = c.dataset.k === k;
    if (on && c.getAttribute('aria-current') !== 'true') {
      const box = $('#chips');
      box.scrollTo({ left: c.offsetLeft - box.clientWidth / 2 + c.clientWidth / 2, behavior: 'smooth' });
    }
    c.setAttribute('aria-current', String(on));
  });
}
function measureBar() {
  S.barH = $('#bar').offsetHeight;
  document.documentElement.style.setProperty('--bar-h', S.barH + 'px');
}

// ===================== 詳細資訊 =====================
function openDetails(id) {
  const item = ITEMS.get(id); if (!item) return;
  const p = primaryName(item, S.lang), s = secondaryName(item, S.lang, p.text);
  const img = safeUrl(item['img-url'] || item.img);
  const sec = (k, v) => v ? `<h4>${esc(t(k))}</h4><p>${esc(v)}</p>` : '';
  const price = num(item.price);
  $('#detTitle').textContent = p.text;
  $('#detTitle').lang = htmlLang(p.code);
  $('#detBody').innerHTML = `
    ${img ? `<img src="${esc(img)}" alt="" onerror="this.remove()">` : ''}
    ${s ? `<p class="p2" lang="${htmlLang(s.code)}">${esc(s.text)}</p>` : ''}
    <div class="row">${badges(item) || '<span></span>'}<span class="pr">${price ? 'NT$' + price.toLocaleString('en-US') : esc(item.price ?? '')}</span></div>
    ${sec('ingredients', ingredientsText(item))}
    ${sec('allergens', pickLangText(item.contains, S.lang))}
    ${sec('itemNotes', pickLangText(item.notes, S.lang))}`;
  $('#detDlg').showModal();
}

// ===================== 語言 =====================
function detectLang() {
  const param = new URLSearchParams(location.search).get('lang');
  const norm = c => {
    c = String(c || '').toLowerCase();
    if (!c) return '';
    if (/^zh-(cn|sg|hans)/.test(c)) return 'zh-CN';
    if (c.startsWith('zh')) return 'zh';
    if (c.startsWith('tl') || c.startsWith('fil')) return 'fil';
    const base = c.split('-')[0];
    return CODES.includes(base) ? base : '';
  };
  if (norm(param)) return norm(param);
  try { const saved = localStorage.getItem(LANG_KEY); if (CODES.includes(saved)) return saved; } catch (e) {}
  for (const l of (navigator.languages || [navigator.language])) { const n = norm(l); if (n) return n; }
  return 'zh';
}
function setLang(code) {
  if (!CODES.includes(code)) return;
  S.lang = code;
  try { localStorage.setItem(LANG_KEY, code); } catch (e) {}
  const url = new URL(location.href); url.searchParams.set('lang', code);
  history.replaceState(null, '', url);
  renderAll();
}

// ===================== 其他 =====================
let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}
async function copyWifi() {
  try { await navigator.clipboard.writeText(WIFI_PASSWORD); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = WIFI_PASSWORD; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove();
  }
  toast('✓ ' + t('copied'));
}
function setType(type) {
  if (S.type === type) return;
  S.type = type;
  renderStatic(); renderMenu(); measureBar();
  const top = $('#bar').getBoundingClientRect().top + scrollY;
  if (scrollY > top) scrollTo({ top, behavior: 'auto' });
}
function clearFilters() {
  S.veg = S.spicy = false;
  ['#fVeg', '#fSpicy'].forEach(s => $(s).setAttribute('aria-pressed', 'false'));
  renderMenu();
}

// ===================== 事件 =====================
function bind() {
  $('#langBtn').addEventListener('click', () => $('#langDlg').showModal());
  $('#langList').addEventListener('click', e => {
    const b = e.target.closest('[data-lang]'); if (!b) return;
    setLang(b.dataset.lang); $('#langDlg').close();
  });
  document.querySelectorAll('dialog').forEach(d => {
    d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
  });
  $('#wifiBtn').addEventListener('click', copyWifi);
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setType(b.dataset.type)));
  document.querySelector('.seg').addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const next = S.type === 'food' ? 'drink' : 'food'; setType(next); $('#tab-' + next).focus();
  });
  [['#fVeg', 'veg'], ['#fSpicy', 'spicy']].forEach(([sel, key]) => {
    $(sel).addEventListener('click', () => { S[key] = !S[key]; $(sel).setAttribute('aria-pressed', String(S[key])); renderMenu(); });
  });
  $('#menu').addEventListener('click', e => {
    if (e.target.closest('#retryBtn')) { S.error = false; load(); return; }
    if (e.target.closest('#clearBtn')) { clearFilters(); return; }
    const it = e.target.closest('[data-id]'); if (it) openDetails(it.dataset.id);
  });
  $('#chips').addEventListener('click', e => {
    const a = e.target.closest('.chip'); if (!a) return;
    e.preventDefault();
    const sec = document.getElementById(a.getAttribute('href').slice(1));
    if (sec) { setChip(a.dataset.k); sec.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  });
  $('#refreshBtn').addEventListener('click', () => load({ silent: true }));
  addEventListener('resize', () => { measureBar(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - S.updatedAt > 2 * 60 * 1000) load({ silent: true });
  });
  setInterval(() => { if (document.visibilityState === 'visible') load({ silent: true }); }, AUTO_REFRESH_MS);
}

// ===================== 啟動 =====================
S.lang = detectLang();
bind();
const hadCache = loadCache();
renderAll();
load({ silent: hadCache });
})();
</script>
</body>
</html>
